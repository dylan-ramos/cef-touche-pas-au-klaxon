name: touche-pas-au-klaxon

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT:-8085}:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Europe/Paris
    volumes:
      - db-data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./docker/mysql/10-app-users.sh:/docker-entrypoint-initdb.d/10-app-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  assets:
    image: node:24.18-alpine
    profiles: ["tools"]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      HOME: /tmp

volumes:
  db-data:
